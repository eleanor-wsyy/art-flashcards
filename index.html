<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>西方美术史各时期代表作图文抽认卡</title>
  <style>
    :root {
      --bg: #12100e;
      --card-bg: #1c1815;
      --card-back: #221d18;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #f5f0e6;
      --muted: #a89f91;
      --border: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #241e18 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    header {
      max-width: 960px;
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--gold);
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn {
      background: rgba(212, 175, 55, 0.12);
      color: var(--gold-light);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn:hover, .btn.active {
      background: var(--gold);
      color: #12100e;
      font-weight: 600;
    }
    .stage {
      width: 100%;
      max-width: 860px;
      perspective: 1400px;
      margin-bottom: 20px;
    }
    .flashcard {
      width: 100%;
      min-height: 540px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.flipped {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }
    .face.back {
      transform: rotateY(180deg);
      background: var(--card-back);
      padding: 24px;
      overflow-y: auto;
    }
    .img-container {
      position: relative;
      flex: 1;
      background: #0d0b09;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 380px;
    }
    .img-container img {
      width: 100%;
      height: 390px;
      object-fit: contain;
      transition: opacity 0.3s;
    }
    .period-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(18, 16, 14, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }
    .front-info {
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 16, 14, 0.9);
    }
    .work-title {
      font-size: 1.35rem;
      color: var(--gold-light);
      font-weight: bold;
    }
    .artist-name {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .flip-hint {
      color: var(--gold);
      font-size: 0.85rem;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 12px;
    }
    .back-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 640px) {
      .section-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.4rem; }
      .flashcard { min-height: 600px; }
      .img-container { min-height: 280px; }
      .img-container img { height: 280px; }
      .front-info { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; }
      .work-title { font-size: 1.15rem; }
      .face.back { padding: 16px; }
      .back-header { flex-direction: column; gap: 6px; }
    }
    .info-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(212, 175, 55, 0.16);
      border-radius: 10px;
      padding: 14px;
    }
    .info-box h4 {
      color: var(--gold);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .info-box p {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }
    .progress {
      color: var(--gold-light);
      font-size: 1rem;
      min-width: 90px;
      text-align: center;
    }
    .blind-mode .front-info .text-group,
    .blind-mode .period-badge {
      filter: blur(10px);
      user-select: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>西方美术史代表作图文抽认卡</h1>
    <p class="subtitle">点击卡片翻转查看【图像视觉还原】【画面特征】【思想情感】与【时代背景】</p>
    <div class="toolbar">
      <button class="btn" id="blindBtn" onclick="toggleBlind()">👁️ 仅看图猜画：关闭</button>
      <button class="btn" onclick="shuffleCards()">🔀 随机抽卡</button>
      <button class="btn" onclick="resetOrder()">⏱️ 按时间顺序</button>
    </div>
  </header>

  <div class="stage" id="stageArea">
    <div class="flashcard" id="cardElement" onclick="flipCard()">
      <!-- 正面 -->
      <div class="face front">
        <div class="img-container">
          <span class="period-badge" id="cardPeriod"></span>
          <img id="cardImage" alt="艺术代表作" referrerpolicy="no-referrer" />
        </div>
        <div class="front-info">
          <div class="text-group">
            <div class="work-title" id="cardTitle"></div>
            <div class="artist-name" id="cardArtist"></div>
          </div>
          <span class="flip-hint">点击翻转背面 ↻</span>
        </div>
      </div>

      <!-- 背面 -->
      <div class="face back">
        <div class="back-header">
          <div>
            <span style="color:var(--gold);font-size:0.9rem;" id="backPeriod"></span>
            <h2 style="color:var(--gold-light);margin-top:4px;" id="backTitle"></h2>
          </div>
          <span style="color:var(--muted);font-size:0.9rem;" id="backArtist"></span>
        </div>
        <div class="section-grid">
          <div class="info-box">
            <h4>【图像视觉还原】</h4>
            <p id="backVisual"></p>
          </div>
          <div class="info-box">
            <h4>【画面特征】</h4>
            <p id="backFeature"></p>
          </div>
          <div class="info-box">
            <h4>【思想情感】</h4>
            <p id="backEmotion"></p>
          </div>
          <div class="info-box">
            <h4>【时代背景】</h4>
            <p id="backContext"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="btn" onclick="prevCard()">← 上一张</button>
    <span class="progress" id="progressText">1 / 12</span>
    <button class="btn" onclick="nextCard()">下一张 →</button>
  </div>

    let currentList = [...ARTWORKS];

    // 生成本地中文字体矢量兜底图（确保永不出现 ??? 乱码）
    function makeLocalSvgFallback(item) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2a221b"/>
            <stop offset="100%" stop-color="#14100d"/>
          </linearGradient>
        </defs>
        <rect width="800" height="450" fill="url(#bg)"/>
        <rect x="24" y="24" width="752" height="402" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2" rx="12"/>
        <text x="400" y="170" text-anchor="middle" fill="#a89f91" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">${item.period}</text>
        <text x="400" y="230" text-anchor="middle" fill="#f3e5ab" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold">${item.title}</text>
        <text x="400" y="280" text-anchor="middle" fill="#d4af37" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22">${item.artist}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function loadArtworkImage(imgEl, item) {
      // 本地图片优先：与页面同源，稳定不依赖 Wikimedia
      imgEl.src = makeLocalSvgFallback(item);
      if (!item.img) return;
      const probe = new Image();
      probe.onload = () => { imgEl.src = item.img; };
      probe.src = item.img;
    }

    function renderCard() {
      const cardEl = document.getElementById("cardElement");
      cardEl.classList.remove("flipped");

      const item = currentList[currentIndex];
      document.getElementById("cardPeriod").textContent = item.period;
      document.getElementById("cardTitle").textContent = item.title;
      document.getElementById("cardArtist").textContent = item.artist;

      document.getElementById("backPeriod").textContent = item.period;
      document.getElementById("backTitle").textContent = item.title;
      document.getElementById("backArtist").textContent = item.artist;
      document.getElementById("backVisual").textContent = item.visual;
      document.getElementById("backFeature").textContent = item.feature;
      document.getElementById("backEmotion").textContent = item.emotion;
      document.getElementById("backContext").textContent = item.context;

      document.getElementById("progressText").textContent = `${currentIndex + 1} / ${currentList.length}`;
      loadArtworkImage(document.getElementById("cardImage"), item);
    }

    function flipCard() {
      document.getElementById("cardElement").classList.toggle("flipped");
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      renderCard();
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % currentList.length;
      renderCard();
    }

    function toggleBlind() {
      isBlind = !isBlind;
      document.getElementById("stageArea").classList.toggle("blind-mode", isBlind);
      const btn = document.getElementById("blindBtn");
      btn.textContent = isBlind ? "👁️ 仅看图猜画：开启" : "👁️ 仅看图猜画：关闭";
      btn.classList.toggle("active", isBlind);
    }

    function shuffleCards() {
      currentList.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCard();
    }

    function resetOrder() {
      currentList = [...ARTWORKS];
      currentIndex = 0;
      renderCard();
    }

    renderCard();
  </script>
</body>
</html>
